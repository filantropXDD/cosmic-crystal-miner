name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Сборка Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода из репозитория
        uses: actions/checkout@v4

      - name: Распаковка архива (если загружен ZIP)
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted
          fi

      - name: Поиск папки Android-проекта
        id: find_dir
        run: |
          DIR=$(find . -name "settings.gradle.kts" -printf '%h\n' | head -n 1)
          if [ -z "$DIR" ]; then
            echo "Папка android-app не найдена!"
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Настройка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Принятие лицензий Android SDK
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Настройка Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Сборка APK (assembleDebug)
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Загрузка готового APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-crystal-miner-debug-apk
          path: ${{ steps.find_dir.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
